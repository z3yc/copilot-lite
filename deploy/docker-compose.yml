# Copilot-Lite 云端部署编排（2C4G 轻量服务器，¥50/月内）
# 使用：cd deploy && docker compose up -d --build
# ⚠️ 需本机/服务器安装 Docker；本地开发无需本文件（见 README 快速开始）
# ⚠️ deploy/.env 必填：POSTGRES_PASSWORD（数据库强口令，缺省直接报错拒绝启动）

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      # 强口令必须来自 deploy/.env（仓库内不再硬编码弱口令）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD 强口令}
      POSTGRES_DB: copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  qdrant:
    image: qdrant/qdrant:v1.9.7
    restart: unless-stopped
    environment:
      # API Key 认证（后端 QDRANT_API_KEY 与此一致）
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请在 deploy/.env 设置 QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant 镜像未内置 curl/wget，用 bash /dev/tcp 做 TCP 探活（零依赖）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 开启口令认证（后端 REDIS_URL 需携带同名口令）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}"]
    environment:
      # 供健康检查 redis-cli 使用（口令不暴露在命令行）
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 模型缓存持久化（BGE 嵌入 ~100MB + reranker ~1GB，避免每次重建容器重下）
      HF_HOME: /models/huggingface
      FASTEMBED_CACHE_PATH: /models/fastembed
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 首次启动执行迁移，再启动服务
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # 用就绪探针（探 DB/向量库）：依赖未就绪时不接流量；start_period 等待迁移完成
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.00"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 自带 busybox wget
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.20"

volumes:
  pgdata:
  qdrantdata:
  models:
