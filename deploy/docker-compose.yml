# Copilot-Lite 云端部署编排（2C4G 轻量服务器，¥50/月内）
# 使用：cd deploy && docker compose up -d --build
# ⚠️ 需本机/服务器安装 Docker；本地开发无需本文件（见 README 快速开始）

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.7
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    # 首次启动执行迁移，再启动服务
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrantdata:
