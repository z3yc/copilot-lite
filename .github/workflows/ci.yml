# CI 流水线：提交 / PR 触发
# - 后端：ruff 检查 + pytest（覆盖率 ≥80%）
# - 前端：类型检查 + 构建
#
# 说明：本仓库托管于 Gitee，此配置同时兼容 GitHub（面试展示用）。
# Gitee 可对接 Gitee Go 或自建 Runner 复用同一脚本。
#
# 触发分支：main（发布）+ develop（集成分支）——
# 保证「功能分支 → develop」的 PR 与合入后的 develop 都过 CI，避免集成分支失去质量门。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    # 测试/迁移均跑在真实 PostgreSQL 上（本地与生产同构，不再用 SQLite）
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest 按 TEST_DATABASE_URL 连库（不存在自动建）
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:root@localhost:5432/copilot_test
      # alembic 迁移读 DATABASE_URL
      DATABASE_URL: postgresql+asyncpg://postgres:root@localhost:5432/copilot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # 防止改了模型/迁移却忘了重新生成初始化 SQL（产物漂移 -> 导入的库与迁移链不一致）
      - name: DB init SQL up-to-date
        run: uv run python scripts/db_init_sql.py --check

      # 迁移链在干净 PG 上从零跑通（此前只能在本地手动验证；SQLite 时代跑不动）
      - name: Migrations apply on fresh PG
        run: uv run alembic upgrade head

      - name: Test + coverage (>=80%)
        run: uv run pytest

  frontend:
    name: Frontend (type check + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test
