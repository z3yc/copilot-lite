[project]
name = "copilot-lite-backend"
version = "0.1.0"
description = "Copilot-Lite 后端服务：个人 AI 智能助理（FastAPI）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "openai>=3.3.1",
    "typer>=0.27.1",
    "rich>=15.0.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI 依赖注入 Depends() 作为默认参数是官方推荐写法
ignore = ["B008"]
