[project]
name = "copilot-cli"
version = "0.1.0"
description = "Copilot-Lite 个人 AI 助理命令行客户端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.27",
    "rich>=13.0",
]

[project.scripts]
copilot = "copilot_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["copilot_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
