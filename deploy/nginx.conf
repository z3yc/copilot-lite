# Nginx：静态前端 + API 反向代理（含 TLS 与安全头模板）
#
# 部署步骤（详见 deploy/DEPLOY.md）：
#   1. 首次部署：只启用 80 段（HTTPS 段保持注释状态，否则证书缺失会导致 nginx 启动失败）
#   2. 申请证书：certbot 签发 Let's Encrypt 证书，挂载到 /etc/nginx/certs/
#   3. 启用 HTTPS：取消下方 443 段的注释 + 80 段的 301 跳转注释，重建 web 容器

server {
    listen 80;
    server_name _;

    # 前端静态资源（web/dist 已打进镜像）
    root /usr/share/nginx/html;
    index index.html;

    # ACME（certbot webroot）挑战：^~ 优先于 location /，且不受 HTTPS 跳转影响，
    # 保证强制跳转开启后证书续期仍可用。宿主机 /var/www/certbot 已挂载进容器
    # （见 deploy/docker-compose.yml）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 上传体大小：与后端 50MB 文档上限对齐（nginx 默认 1MB 会拦截大文档上传）
    client_max_body_size 55m;

    # 静态资源压缩（前端 JS 体积较大）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头（HSTS 仅应在 TLS 生效后开启，见 443 段）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 路由回退
    location / {
        # HTTPS 就绪后启用强制跳转（取消下一行注释）
        # 放在 location 内而非 server 级：server 级 return 会先于 location 匹配执行，
        # 会把 /.well-known/acme-challenge/ 也一起重定向，导致证书续期失败
        # return 301 https://$host$request_uri;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        # 工具轮最长 ≈ LLM_TIMEOUT(60s) × 5 轮 + 缓冲；给足 360s 防误杀长工具链
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}

