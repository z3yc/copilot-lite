# Copilot-Lite 云端部署编排（2C4G 轻量服务器，¥50/月内）
# 使用：cd deploy && docker compose up -d --build
# ⚠️ 需本机/服务器安装 Docker；本地开发无需本文件（见 README 快速开始）

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.7
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant 镜像未内置 curl/wget，用 bash /dev/tcp 做 TCP 探活（零依赖）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      # 模型缓存持久化（BGE 嵌入 ~100MB + reranker ~1GB，避免每次重建容器重下）
      HF_HOME: /models/huggingface
      FASTEMBED_CACHE_PATH: /models/fastembed
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    # 首次启动执行迁移，再启动服务
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # 容器内 python 自带 urllib，无需 curl/wget
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrantdata:
  models:
